# Конфигурация cargo-deny. Локально: cargo deny check

[advisories]
version = 2
yanked = "deny"
# Исключения добавлять только с обоснованием в комментарии и ссылкой на ADR.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
]
confidence-threshold = 0.9
# Крейты проекта объявляют license = "MIT OR Apache-2.0" и проверяются наравне
# с зависимостями: новый крейт без поля license уронит CI — это и есть напоминание.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
