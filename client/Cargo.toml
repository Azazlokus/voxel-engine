[package]
name = "client"
description = "Бинарник: собирает App из плагинов и запускает движок"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bevy_ecs.workspace = true
engine_assets.workspace = true
engine_core.workspace = true
engine_world.workspace = true
game_base.workspace = true
tracing.workspace = true

# Только в бинарнике: CLAUDE.md разрешает anyhow лишь здесь.
anyhow = "1.0.104"
# tracing сам события не выводит — нужен подписчик; env-filter даёт RUST_LOG.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
