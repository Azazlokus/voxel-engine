[workspace]
resolver = "3"
members = ["crates/*", "game_base", "client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Azazlokus/voxel-engine"
publish = false

[workspace.dependencies]
# Внутренние крейты
engine_core = { path = "crates/engine_core" }
engine_registry = { path = "crates/engine_registry" }
engine_world = { path = "crates/engine_world" }
engine_assets = { path = "crates/engine_assets" }
game_base = { path = "game_base" }

# Внешние зависимости — версия и фичи задаются здесь, крейты ссылаются через workspace = true
bevy_ecs = { version = "0.18.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "trace",
    "backtrace",
] }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
thiserror = "2.0.21"
tracing = "0.1.44"

[workspace.lints.rust]
# unsafe разрешён только с обоснованием // SAFETY: (проверяется в CI),
# поэтому здесь предупреждение, а не запрет.
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Горячие циклы: аллокация в цикле — то, что мы ловим в первую очередь.
needless_collect = "warn"
redundant_clone = "warn"
# Паники вне тестов недопустимы (CLAUDE.md).
unwrap_used = "warn"
expect_used = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Бенчмарки и профилирование: релиз со отладочными символами.
[profile.profiling]
inherits = "release"
debug = true
panic = "unwind"
