name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Новые CVE появляются и в неизменившемся коде — проверяем каждую ночь.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # advisories — известные уязвимости и заброшенные крейты
        # bans      — дубли версий и wildcard-зависимости
        # licenses  — только разрешённые лицензии
        # sources   — зависимости только из crates.io
        checks: [advisories, bans, licenses, sources]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  secrets:
    name: Поиск секретов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ''
          head: HEAD
          extra_args: --results=verified

  dependency-review:
    name: Обзор новых зависимостей
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
